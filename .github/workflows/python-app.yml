name: Python package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, ci-coverage-token-ux ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        mkdir -p pytest-artifacts
        pytest -q --junitxml=pytest-artifacts/junit.xml --cov=modules --cov-report=xml:pytest-artifacts/coverage.xml | tee pytest-artifacts/pytest.log
    - name: Upload pytest artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pytest-artifacts
        path: pytest-artifacts
