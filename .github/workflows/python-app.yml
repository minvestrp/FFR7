name: Python package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, ci-coverage-token-ux ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install system dependencies (for WeasyPrint / build)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential \
          gcc \
          libcairo2 \
          libpango1.0-0 \
          libgdk-pixbuf2.0-0 \
          libffi-dev \
          libxml2 \
          libxslt1-dev \
          libjpeg-dev \
          zlib1g-dev \
          ca-certificates \
        && rm -rf /var/lib/apt/lists/*
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: |
        mkdir -p pytest-artifacts
        pytest -q --junitxml=pytest-artifacts/junit.xml --cov=modules --cov-report=xml:pytest-artifacts/coverage.xml | tee pytest-artifacts/pytest.log
    - name: Upload pytest artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pytest-artifacts
        path: pytest-artifacts
