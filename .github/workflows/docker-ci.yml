name: Docker Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, ci-coverage-token-ux ]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: smartsec:ci-${{ github.run_id }}

      - name: Run tests inside image
        run: |
          mkdir -p pytest-artifacts
          docker run --rm -v "${{ github.workspace }}/pytest-artifacts:/artifacts" smartsec:ci-${{ github.run_id }} bash -lc "pytest -q --junitxml=/artifacts/junit.xml --cov=modules --cov-report=xml:/artifacts/coverage.xml | tee /artifacts/pytest.log"

      - name: Upload pytest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: pytest-artifacts

  build-prod:
    runs-on: ubuntu-latest
    needs: docker-test
    # Only push production image when on main branch
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push production image (Dockerfile.prod)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartsec:prod-${{ github.run_id }}
            ghcr.io/${{ github.repository_owner }}/smartsec:prod:latest

