{% extends 'base.html' %}
{% block content %}
  <h1>Admin Login</h1>
  {% if error %}
    <p style="color: red">{{ error }}</p>
  {% endif %}
  <form method="post" action="/admin/login">
    <label>Token: <input type="password" name="token"/></label>
    <button type="submit">Login</button>
  </form>
{% endblock %}
